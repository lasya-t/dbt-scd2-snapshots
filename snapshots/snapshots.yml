snapshots:
  # timestamp strategy: trusts updated_at to tell what changed
  - name: customers_snapshot_ts
    relation: source('crm', 'customers')
    config:
      unique_key: customer_id
      strategy: timestamp
      updated_at: updated_at
      hard_deletes: invalidate

  # check strategy: compares the tracked columns themselves
  - name: customers_snapshot_check
    relation: source('crm', 'customers')
    config:
      unique_key: customer_id
      strategy: check
      check_cols: [name, state, plan]
      hard_deletes: invalidate
